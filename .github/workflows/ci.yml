name: Backend verification
on:
  push:
    branches: [experiment]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: product_management_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d product_management_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/product_management_test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/product_management_test
      JWT_SECRET: test-access-secret-for-ci-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci-at-least-32-characters
      CORS_ORIGINS: '*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run test:cov -- --runInBand
      - run: npm run test:integration -- --runInBand
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
